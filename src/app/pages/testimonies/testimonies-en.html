<haf-site-header />

    

    <main id="main-content" tabindex="-1" class="testimonies-main">
      <section class="testimonies-hero">
        <div class="testimonies-hero-content">
          <h1>Testimonies</h1>
          <p>Testimonies of faith, healing, and transformation</p>
        </div>
      </section>

      <div class="search-container">
        <input type="text" class="search-bar" placeholder="Search by name..." (input)="search.set($any($event.target).value)">
      </div>
      
      <div class="testimonies-controls">
        <button class="control-btn" id="shuffleTestimonies" (click)="shuffle()"><i class="fas fa-random"></i> Shuffle</button>
      </div>
      
      <div class="no-results" [style.display]="hasResults() ? 'none' : 'block'">
        No results found
      </div>

      <section class="testimonies-grid">@for (story of stories(); track story.id) {
      <div class="testimony-card" hafTestimonyCard [story]="story" [class.hidden]="!matches(story)"></div>
    }</section>
    </main>

    <haf-site-footer />
